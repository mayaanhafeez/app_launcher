# Rose Pine Moon — shipped with KitsuneLauncher.
# Source: the upstream Rosé Pine palette, whose role names map onto these directly
# (base, surface, muted, subtle, text, and the named hues).
#
# Not converted from btop like its neighbours: btop's copies of the three Rosé Pine
# variants set hi_fg to the text colour, so an accent taken from there would be
# invisible against the label it tints. The accent below is the hue set-theme already
# picks for this variant (rose).
#
# Note that Omarchy ships its `rose-pine` as the light Dawn variant. This file is the
# dark original, and Dawn keeps its own name.

mode = "dark"

accent = "#ea9a97"
selection = "#44415a"
muted = "#6e6a86"

background = "#232136"
lighter_background = "#2a273f"
dark_background = "#393552"
darker_background = "#2a283e"

foreground = "#e0def4"
dark_foreground = "#6e6a86"
light_foreground = "#908caa"
bright_foreground = "#e0def4"

red = "#eb6f92"
yellow = "#f6c177"
orange = "#ea9a97"
green = "#3e8fb0"
cyan = "#ea9a97"
blue = "#9ccfd8"
magenta = "#c4a7e7"
