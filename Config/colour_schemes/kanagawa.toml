# Kanagawa — shipped with KitsuneLauncher.
# Source: Omarchy's themes/kanagawa/colors.toml, with one change: its `accent` is
# the same colour as its foreground, which leaves the accent invisible against the
# label it tints, so the accent here is the palette's own blue.

mode = "dark"

accent = "#7e9cd8"  # crystal blue; Omarchy sets accent to the text colour here
selection = "#363646"
muted = "#54546D"
border = "#dcd7ba"  # matching set-theme's BORDERS_COLOR

background = "#1f1f28"
dark_background = "#17171e"
darker_background = "#111116"
lighter_background = "#223249"

foreground = "#dcd7ba"
dark_foreground = "#727169"
light_foreground = "#c8c093"
bright_foreground = "#dcd7ba"

red = "#c34043"
yellow = "#c0a36e"
orange = "#c17158"
green = "#76946a"
cyan = "#6a9589"
blue = "#7e9cd8"
magenta = "#957fb8"
brown = "#60382c"

bright_red = "#e82424"
bright_yellow = "#e6c384"
bright_green = "#98bb6c"
bright_cyan = "#7aa89f"
bright_blue = "#7fb4ca"
bright_magenta = "#938aa9"
